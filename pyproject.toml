[project]
name = "agent-he"
version = "0.1.0"
description = "Agent personnel de recherche de recettes et mélanges d'huiles essentielles"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "httpx>=0.28.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0.3",
    "streamlit>=1.66.0",
    "trafilatura>=2.3.1",
    "typer>=0.27.3",
]

[project.scripts]
agent-he = "agent_he.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_he"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
# Le projet est rédigé en français : les caractères accentués et typographiques
# (« », ’, …) sont légitimes dans les chaînes et commentaires.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-local-folder = ["aides", "web"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["tests"]
markers = [
    "live: tests qui appellent de vrais services externes (lancés manuellement)",
]
