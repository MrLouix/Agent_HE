# Référentiel des huiles essentielles (spécification §3.1).
#
# Une entrée par HE et, lorsque le chémotype change l'usage ou la sécurité, par chémotype
# (ex. romarin à cinéole / à camphre). Ce fichier ne contient que de la nomenclature :
# aucune valeur de sécurité (plafond, drapeau) — celles-ci vivent dans securite.yaml.
#
# Champs :
#   id                identifiant stable, utilisé partout (securite.yaml, recettes, journal)
#   nom_latin         nom botanique de référence
#   synonymes_latins  autres noms botaniques acceptés (anciens noms, graphies)
#   noms_fr, noms_en  noms usuels
#   partie_distillee  partie de la plante
#   chemotypes        chémotypes reconnus pour cette entrée (jamais confondus avec le nom latin)

