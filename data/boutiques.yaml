# Boutiques spécialisées en HE (spécification §13).
#
# ⚠️ Avant d'activer une boutique : lire ses CGU et son robots.txt, puis renseigner
# `cgu_verifiees: true` et `cgu_verifiees_le`. Le scraper refuse toute boutique dont les
# CGU ne sont pas marquées comme vérifiées, et respecte toujours robots.txt.
#
# Champs :
#   acces               api | flux | scraping
#   delai_s             délai minimal entre deux requêtes vers ce domaine
#   url_recherche       URL de recherche avec {q} (ex. https://…/recherche?q={q}), à renseigner
#   motif_lien_produit  expression régulière des liens produit dans la page de recherche
#   extraction          jsonld (données structurées schema.org Product)

- id: aroma-zone
  nom: Aroma-Zone
  url: https://www.aroma-zone.com
  acces: scraping
  cgu_verifiees: false
  cgu_verifiees_le: null
  delai_s: 5
  url_recherche: null
  motif_lien_produit: null
  extraction: jsonld

