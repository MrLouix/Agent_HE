# Jeu d'évaluation (spécification §12), joué sur fixtures (aucun réseau).
#
# Les critères BLOQUANTS sont vérifiés sur chaque cas par tests/eval/test_eval.py :
# 0 dosage pour profil exclu, 0 dépassement de plafond, 0 voie orale, 0 HE non tracée,
# 0 HE exclue personnellement, 0 relâchement de contrôle dû au journal.
#
# Champs : besoin, voies, questionnaire, texte, scenario (voir scenarios.py),
# exclusions, journal, attendu {modes, he_absentes, avertissement, contradiction,
# demande_invalide}.

